; Throwaway diagnostic: is the XPT2046 wired where we think it is?
; No TFT_eSPI, no touch library, no SPI peripheral -- just bit-banged pins, so
; nothing between the chip and the result.
[env:probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
