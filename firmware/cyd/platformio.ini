; Cheap Yellow Display -- ESP32-2432S028R (USB-C, ILI9341, resistive XPT2046)
;
; The whole reason this project uses PlatformIO rather than the Arduino IDE is
; the block of build_flags below. TFT_eSPI is configured by editing a header
; INSIDE the library by default, which is not version controlled and is wiped
; by a library update -- and a wrong pin set is the single most common cause of
; a blank or white CYD screen. Here the configuration is committed, so a fresh
; clone builds the same firmware.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; The registry copy is from 2019 and its begin() takes no SPI instance,
    ; which cannot work on this board: the touch controller is on a SECOND SPI
    ; bus, separate from the display. Current master added begin(SPIClass&).
    ; Pinned to a commit so the build stays reproducible.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    ; ---- TFT_eSPI: this board's display ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1          ; confirmed from the product listing
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21                 ; backlight. Undriven, the board looks dead.
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; ---- touch: a SEPARATE SPI bus from the display ----
    ; Getting this wrong is the classic "screen works, touch does nothing".
    -DCYD_TOUCH_CLK=25
    -DCYD_TOUCH_MOSI=32
    -DCYD_TOUCH_MISO=39
    -DCYD_TOUCH_CS=33
    -DCYD_TOUCH_IRQ=36
